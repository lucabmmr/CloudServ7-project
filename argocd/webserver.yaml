apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: webserver
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/lukazieg/CloudServ7-Webserver.git
    targetRevision: Lena
    path: k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
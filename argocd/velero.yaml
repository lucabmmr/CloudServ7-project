# kommentiert: siehe grafana.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: velero
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/lucabmmr/CloudServ7-project.git
    targetRevision: main
    path: manifests/velero

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

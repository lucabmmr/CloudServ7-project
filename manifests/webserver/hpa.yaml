apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: express-web-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: express-web
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 15
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 20
      policies:
        - type: Percent
          value: 50
          periodSeconds: 15